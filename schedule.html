<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Schedule - 早稲田大学ショパンの会</title>
        <meta name="description" content="年間スケジュール">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/component.css">
        <link rel="stylesheet" href="css/responsive.css">
    </head>

    <body>
        <div id="header-container"></div>
        
        <h2>Schedule</h2>
        
        <p>ショパンの会の1年間の主な予定です。（※予定は変更される場合があります）</p>

        <p class="schedule-scroll-hint">表は左右にスクロールできます →</p>
        <div class="schedule-scroll" role="region" aria-label="年間スケジュール（左右にスクロールできます）" tabindex="0">
        <table id="schedule-table">
            <thead>
                <tr>
                    <th style="width: 20%;">状態</th>
                    <th style="width: 25%;">月・季節</th>
                    <th style="width: 55%;">行事</th>
                </tr>
            </thead>
            <tbody id="schedule-body">
                <tr>
                    <td colspan="3">読み込み中...</td>
                </tr>
            </tbody>
        </table>
        </div>

        <div id="footer"></div>

        <script>
            // 画面幅に応じてヘッダーを切り替える。リサイズ中の競合と再取得を防ぐ。
            let activeHeaderFile = null;
            let headerRequestSerial = 0;
            function loadHeader() {
                const headerFile = window.matchMedia('(max-width: 768px)').matches
                    ? 'phone-header.html' : 'pc-header.html';
                if (headerFile === activeHeaderFile) return;
                activeHeaderFile = headerFile;
                const serial = ++headerRequestSerial;
                fetch(headerFile)
                    .then(response => {
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        return response.text();
                    })
                    .then(data => {
                        if (serial !== headerRequestSerial) return;
                        const header = document.getElementById('header-container');
                        if (header) header.innerHTML = data; // GitHub上で管理する固定HTMLだけ
                    })
                    .catch(error => {
                        if (serial === headerRequestSerial) activeHeaderFile = null;
                        console.error('ヘッダーの読み込みに失敗しました:', error);
                    });
            }
            loadHeader();
            window.addEventListener('resize', loadHeader);

                        // --- Scheduleデータ (JSON) の読み込みと表示処理 ---
            const JSON_URL = './data/schedule.json';

            // スプレッドシートから来た値はHTMLとして解釈せず、文字列として描画する。
            // whiteSpace: pre-line で従来の <br> 相当の改行表示を維持する。
            function appendSafeCell(row, value) {
                const td = document.createElement('td');
                td.textContent = value == null ? '' : String(value);
                td.style.whiteSpace = 'pre-line';
                row.appendChild(td);
            }

            // データが空の場合や取得エラーの場合のメッセージを安全に表示する。
            function showScheduleMessage(message) {
                const row = document.createElement('tr');
                const cell = document.createElement('td');
                cell.colSpan = 3;
                cell.textContent = message;
                row.appendChild(cell);
                document.getElementById('schedule-body').replaceChildren(row);
            }

            fetch(JSON_URL)
                .then(response => {
                    if (!response.ok) throw new Error('JSONファイルが見つかりません');
                    return response.json();
                })
                .then(data => {
                    if (!Array.isArray(data) || data.length === 0) {
                        showScheduleMessage('現在予定されているスケジュールはありません。');
                        return;
                    }

                    const fragment = document.createDocumentFragment();
                    data.forEach(item => {
                        const values = item && typeof item === 'object' ? item : {};
                        const row = document.createElement('tr');
                        appendSafeCell(row, values.status);
                        appendSafeCell(row, values.period);
                        appendSafeCell(row, values.event);
                        fragment.appendChild(row);
                    });
                    document.getElementById('schedule-body').replaceChildren(fragment);
                })
                .catch(error => {
                    console.error('スケジュールの読み込みエラー:', error);
                    showScheduleMessage('スケジュールの読み込みに失敗しました。');
                });


            // --- 共通: フッター読み込み処理 ---
            fetch("footer.html")
            .then((response) => response.text())
            .then((data) => {
                const footer = document.querySelector("#footer");
                if (footer) footer.innerHTML = data;
            })
            .catch((error) => console.error("footer.html の読み込みに失敗しました:", error));
        </script>
    </body>
</html>
