<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Concert</title>
        <meta name="description" content="コンサート情報">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/component.css">
        <link rel="stylesheet" href="css/responsive.css">
    </head>

    <body>
        <div id="header"></div>
        <h2>Concert</h2>

        <div style="margin-bottom: 20px; line-height: 1.6;">
            <p style="color: #333; margin-bottom: 5px;">こちらが過去のプログラムです。押下するとGoogle Driveに飛びます。なお、足りない部分のプログラムをお持ちの方は送ってくださると幸いです。</p>
            <p style="color: #333; margin-top: 0;">すべてのプログラムを一括で閲覧したい場合は、こちらの<a href="https://drive.google.com/drive/folders/1pxYDyI0R7yqyQzDh6U2w3UaX7RYcNlpk?usp=drive_link" target="_blank" rel="noopener noreferrer" style="color: #0056b3; text-decoration: underline;">Google Driveフォルダ</a>も便利です。</p>
        </div>

        <div id="next-concert" style="margin-bottom: 30px; padding: 15px; text-align: center; background-color: transparent;">
            <p style="color: #333;">読み込み中...</p>
        </div>

        <div id="past-concerts"></div>

        <div id="footer"></div>
        
        <script>
            // 画面幅に応じてヘッダーを切り替える。リサイズ中の競合と再取得を防ぐ。
            let activeHeaderFile = null;
            let headerRequestSerial = 0;
            function loadHeader() {
                const headerFile = window.matchMedia('(max-width: 768px)').matches
                    ? 'phone-header.html' : 'pc-header.html';
                if (headerFile === activeHeaderFile) return;
                activeHeaderFile = headerFile;
                const serial = ++headerRequestSerial;
                fetch(headerFile)
                    .then(response => {
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        return response.text();
                    })
                    .then(data => {
                        if (serial !== headerRequestSerial) return;
                        const header = document.getElementById('header');
                        if (header) header.innerHTML = data; // GitHub上で管理する固定HTMLだけ
                    })
                    .catch(error => {
                        if (serial === headerRequestSerial) activeHeaderFile = null;
                        console.error('ヘッダーの読み込みに失敗しました:', error);
                    });
            }
            loadHeader();
            window.addEventListener('resize', loadHeader);

                        fetch("footer.html")
            .then(response => response.text())
            .then(data => {
                const footer = document.querySelector("#footer");
                if (footer) footer.innerHTML = data;
            });

            // --- コンサート情報の読み込みと表示 ---
            // JSONから取得した文字列はHTMLとして解釈させない。
            // 外部リンクはHTTPS URLだけを許可する。
            function safeHttpsUrl(value) {
                if (typeof value !== "string") return null;
                const candidate = value.trim();
                if (!/^https:\/\//i.test(candidate)) return null;

                try {
                    const parsed = new URL(candidate);
                    if (parsed.protocol !== "https:" || !parsed.hostname ||
                        parsed.username || parsed.password) {
                        return null;
                    }
                    return parsed.href;
                } catch (error) {
                    return null;
                }
            }

            function makeLink(url, label, color) {
                const a = document.createElement("a");
                a.href = url;
                a.target = "_blank";
                a.rel = "noopener noreferrer";
                a.style.color = color;
                a.style.textDecoration = "underline";
                a.textContent = String(label ?? "");
                return a;
            }

            function makeDescription(label, value) {
                const p = document.createElement("p");
                p.style.color = "#333";
                const strong = document.createElement("strong");
                strong.textContent = label;
                p.append(strong, document.createTextNode(" "));
                if (value instanceof Node) {
                    p.append(value);
                } else {
                    p.append(document.createTextNode(String(value ?? "")));
                }
                return p;
            }

            fetch("./data/concerts.json")
            .then(response => {
                if (!response.ok) throw new Error("コンサート情報の取得に失敗しました");
                return response.json();
            })
            .then(data => {
                if (!Array.isArray(data)) throw new Error("JSONの形式が正しくありません");

                // 「終了」以外の最初の1件を次回として表示（従来の仕様）。
                const nextConcerts = data.filter(c => c && c.status !== "終了");
                const pastConcerts = data.filter(c => c && c.status === "終了");

                // 1. 次回の演奏会
                const nextContainer = document.getElementById("next-concert");
                const nextTitle = document.createElement("h3");
                nextTitle.style.marginTop = "0";
                nextTitle.style.color = "#333";

                if (nextConcerts.length > 0) {
                    const next = nextConcerts[0];
                    nextTitle.textContent = "次回の演奏会：" + String(next.name ?? "");

                    const placeUrl = safeHttpsUrl(next.place_link);
                    const placeText = next.place || "未定";
                    const placeDisplay = placeUrl
                        ? makeLink(placeUrl, next.place, "#0056b3")
                        : String(placeText);

                    nextContainer.replaceChildren(
                        nextTitle,
                        makeDescription("場所：", placeDisplay),
                        makeDescription("時間（日程）：", next.date || "未定")
                    );
                } else {
                    nextTitle.textContent = "次回の演奏会：未定";
                    const p = document.createElement("p");
                    p.style.color = "#333";
                    p.textContent = "現在、予定されている演奏会はありません。";
                    nextContainer.replaceChildren(nextTitle, p);
                }

                // 2. 過去の演奏会を年度別にまとめて降順表示
                const groupedByYear = Object.create(null);
                pastConcerts.forEach(c => {
                    const match = String(c.name ?? "").match(/(\d{4})/);
                    const year = match ? match[1] + "年度" : "その他";
                    if (!groupedByYear[year]) groupedByYear[year] = [];
                    groupedByYear[year].push(c);
                });

                const sortedYears = Object.keys(groupedByYear).sort((a, b) => {
                    if (a === "その他") return 1;
                    if (b === "その他") return -1;
                    return parseInt(b, 10) - parseInt(a, 10);
                });

                const pastContainer = document.getElementById("past-concerts");
                const fragment = document.createDocumentFragment();

                sortedYears.forEach(year => {
                    const heading = document.createElement("h3");
                    heading.style.borderBottom = "2px solid #ccc";
                    heading.style.paddingBottom = "5px";
                    heading.style.marginTop = "30px";
                    heading.style.color = "#333";
                    heading.textContent = year;
                    fragment.append(heading);

                    const ul = document.createElement("ul");
                    ul.style.listStyleType = "disc";
                    ul.style.marginLeft = "20px";
                    ul.style.lineHeight = "1.8";
                    ul.style.color = "#333";

                    groupedByYear[year].forEach(c => {
                        const li = document.createElement("li");
                        li.style.color = "#333";
                        const programUrl = safeHttpsUrl(c.program_link);
                        if (programUrl) {
                            li.append(makeLink(programUrl, c.name, "#333"));
                        } else {
                            li.textContent = String(c.name ?? "");
                        }
                        ul.append(li);
                    });
                    fragment.append(ul);
                });

                pastContainer.replaceChildren(fragment);
            })
            .catch(error => {
                console.error("Concertsデータの読み込みに失敗しました:", error);
                const p = document.createElement("p");
                p.style.color = "#333";
                p.textContent = "コンサート情報の読み込みに失敗しました。";
                document.getElementById("next-concert").replaceChildren(p);
            });
        </script>
    </body>
</html>
